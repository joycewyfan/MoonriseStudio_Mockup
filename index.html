<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hearthvale Interactive Mockup</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body>
  <main>
    <div id="game-shell">
      <div id="rotate-message"><strong>Rotate your phone sideways to play Hearthvale.</strong><br>The landscape layout gives you larger controls and a clearer view of the village.</div>
      <div id="game-container"></div>
      <div class="help">
        <strong>Controls:</strong> Mobile: drag the left joystick to move and tap INTERACT. Desktop: WASD/arrow keys and Space. Tap or click menu and battle buttons.
      </div>
    </div>
  </main>
  <script src="sketch.js"></script>
</body>
</html>
